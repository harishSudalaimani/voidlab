apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.10.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/values/observability/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      path: gitops/values/observability/kube-prometheus-stack/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
