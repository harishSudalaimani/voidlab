apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: database
  labels:
    app.kubernetes.io/name: redisinsight
    app.kubernetes.io/instance: redisinsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redisinsight
      app.kubernetes.io/instance: redisinsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redisinsight
        app.kubernetes.io/instance: redisinsight
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redisinsight
          image: redis/redisinsight:3.10.2
          imagePullPolicy: IfNotPresent
          env:
            - name: RI_APP_HOST
              value: 0.0.0.0
            - name: RI_APP_PORT
              value: "5540"
            - name: RI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: redisinsight-credentials
                  key: RI_ENCRYPTION_KEY
            - name: RI_REDIS_HOST
              value: redis.database.svc.cluster.local
            - name: RI_REDIS_PORT
              value: "6379"
            - name: RI_REDIS_ALIAS
              value: VoidLab Redis
            - name: RI_REDIS_USERNAME
              value: default
            - name: RI_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: RI_REDIS_TLS
              value: "false"
          ports:
            - name: http
              containerPort: 5540
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redisinsight-data
        - name: tmp
          emptyDir: {}
