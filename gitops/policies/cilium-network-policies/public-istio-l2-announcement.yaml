apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: public-istio
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: istio-system
      io.kubernetes.service.name: public-istio
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: cp
  interfaces:
    - ^enp8s0$
  loadBalancerIPs: true
