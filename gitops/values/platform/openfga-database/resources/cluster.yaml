apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-db
  namespace: openfga
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
      secret:
        name: openfga-db-credentials
  storage:
    storageClass: longhorn
    size: 8Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: cp
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
