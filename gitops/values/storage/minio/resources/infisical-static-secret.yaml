apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: minio-credentials
  namespace: minio
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /minio
  targets:
    - name: minio-env-configuration
      namespace: minio
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          config.env: |-
            export MINIO_ROOT_USER={{ .MINIO_ROOT_USER.Value }}
            export MINIO_ROOT_PASSWORD={{ .MINIO_ROOT_PASSWORD.Value }}
            export MINIO_BROWSER_REDIRECT_URL=https://minio.kiroku.life
          MINIO_ROOT_USER: "{{ .MINIO_ROOT_USER.Value }}"
          MINIO_ROOT_PASSWORD: "{{ .MINIO_ROOT_PASSWORD.Value }}"
