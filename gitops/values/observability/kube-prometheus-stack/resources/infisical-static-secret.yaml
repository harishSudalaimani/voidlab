apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /grafana
  targets:
    - name: grafana-oidc
      namespace: observability
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          client-secret: "{{ .GRAFANA_KEYCLOAK_CLIENT_SECRET.Value }}"
