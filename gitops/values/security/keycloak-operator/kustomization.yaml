apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - https://github.com/keycloak/keycloak-k8s-resources/kubernetes?ref=26.8.2
patches:
  - path: operator-scheduling-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak-operator
