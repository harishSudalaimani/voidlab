apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: keycloak-database-credentials
  namespace: keycloak
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /keycloak
  targets:
    - name: keycloak-db-credentials
      namespace: keycloak
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: "{{ .KEYCLOAK_DATABASE_USERNAME.Value }}"
          password: "{{ .KEYCLOAK_DATABASE_PASSWORD.Value }}"
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: keycloak-client-secrets
  namespace: keycloak
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /keycloak
  targets:
    - name: keycloak-client-secrets
      namespace: keycloak
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          policy-reporter-client-secret: "{{ .POLICY_REPORTER_OIDC_CLIENT_SECRET.Value }}"
