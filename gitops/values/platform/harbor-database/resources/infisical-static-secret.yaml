apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: harbor-database-credentials
  namespace: harbor
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /harbor
  targets:
    - name: harbor-db-credentials
      namespace: harbor
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: "{{ .HARBOR_DATABASE_USERNAME.Value }}"
          password: "{{ .HARBOR_DATABASE_PASSWORD.Value }}"
