apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-pki
spec:
  # In-cluster Infisical service URL. Do not use the local port-forward URL.
  url: http://infisical-infisical-standalone-infisical.security.svc.cluster.local:8080
  application: voidlab-k8
  profile: voidlab
  authentication:
    method: universal
    universal:
      clientIdRef:
        name: infisical-universal-auth
        namespace: cert-manager
        key: clientId
      clientSecretRef:
        name: infisical-universal-auth
        namespace: cert-manager
        key: clientSecret
