apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: argocd-oidc-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /argocd
  targets:
    - name: argocd-oidc-secret
      namespace: argocd
      kind: Secret
      creationPolicy: Owner
      metadata:
        annotations: {}
        labels:
          app.kubernetes.io/part-of: argocd
      template:
        engineVersion: v1
        data:
          oidc.keycloak.clientSecret: "{{ .ARGOCD_OIDC_CLIENT_SECRET.Value }}"
