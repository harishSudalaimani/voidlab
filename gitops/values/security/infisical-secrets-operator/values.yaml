hostAPI: http://infisical.database.svc.cluster.local:8080/api

controllerManager:
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  serviceAccount:
    create: true
    name: infisical-secrets-operator
  scopedNamespaces:
    - minio-tenant
  scopedRBAC: true

# Argo CD applies the CRDs directly and does not wait on Helm hook Jobs.
defaultResourcesHelmHooks: false

defaultInfisicalConnection:
  enabled: true
  address: http://infisical.database.svc.cluster.local:8080/api
