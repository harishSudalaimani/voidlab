apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: harbor-application-secrets
  namespace: harbor
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /harbor
  targets:
    - name: harbor-secrets
      namespace: harbor
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          HARBOR_ADMIN_PASSWORD: "{{ .HARBOR_ADMIN_PASSWORD.Value }}"
          secretKey: "{{ .HARBOR_SECRET_KEY.Value }}"
          secret: "{{ .HARBOR_CORE_SECRET.Value }}"
          CSRF_KEY: "{{ .HARBOR_CSRF_KEY.Value }}"
          JOBSERVICE_SECRET: "{{ .HARBOR_JOBSERVICE_SECRET.Value }}"
          REGISTRY_HTTP_SECRET: "{{ .HARBOR_REGISTRY_HTTP_SECRET.Value }}"
          REGISTRY_PASSWD: "{{ .HARBOR_REGISTRY_PASSWORD.Value }}"
          REGISTRY_HTPASSWD: "{{ .HARBOR_REGISTRY_HTPASSWD.Value }}"
          REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .HARBOR_MINIO_ACCESS_KEY.Value }}"
          REGISTRY_STORAGE_S3_SECRETKEY: "{{ .HARBOR_MINIO_SECRET_KEY.Value }}"

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: public
      namespace: istio-system
      sectionName: https
  hostnames:
    - harbor.kiroku.life
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor
          port: 80
