apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: storage
  sources:
    - repoURL: https://operator.min.io/
      chart: operator
      targetRevision: 7.1.1
      helm:
        releaseName: minio-operator
        namespace: minio-operator
        valuesObject:
          operator:
            replicaCount: 1
            nodeSelector:
              kubernetes.io/hostname: cp
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
    - repoURL: https://operator.min.io/
      chart: tenant
      targetRevision: 7.1.1
      helm:
        releaseName: minio
        namespace: minio-tenant
        valueFiles:
          - $values/gitops/values/storage/minio/tenant-values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      ref: values
      path: gitops/values/storage/minio/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-tenant
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
