apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: service-mesh
  sources:
    - repoURL: https://blob.istio.io/istio-release/charts
      chart: base
      targetRevision: 1.32.0
      helm:
        releaseName: istio-base
        valueFiles:
          - $values/gitops/values/networking/istio/base-values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - Prune=false
