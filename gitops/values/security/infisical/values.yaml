infisical:
  enabled: true
  fullnameOverride: infisical
  replicaCount: 2
  nodeSelector:
    kubernetes.io/hostname: worker
  rolloutOnEveryRender: false
  kubeSecretRef: platform-secrets
  extraEnv:
    # CloudNativePG generates this secret after the database cluster is ready.
    - name: DB_CONNECTION_URI
      valueFrom:
        secretKeyRef:
          name: postgresql-app
          key: uri
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: platform-secrets
          key: REDIS_PASSWORD
    - name: REDIS_URL
      value: redis://default:$(REDIS_PASSWORD)@redis.database.svc.cluster.local:6379/0
    - name: SITE_URL
      value: http://localhost:8081

ingress:
  enabled: false
  nginx:
    enabled: false

postgresql:
  # PostgreSQL is provided by the CloudNativePG Application.
  enabled: false

redis:
  # Redis is a shared storage service deployed separately in the database namespace.
  enabled: false
