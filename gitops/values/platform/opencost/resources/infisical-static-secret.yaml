apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: opencost-oauth2-proxy
  namespace: opencost
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /opencost
  targets:
    - name: opencost-oauth2-proxy
      namespace: opencost
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          client-id: opencost
          client-secret: "{{ .OPENCOST_OIDC_CLIENT_SECRET.Value }}"
          cookie-secret: "{{ .OPENCOST_OAUTH2_PROXY_COOKIE_SECRET.Value }}"
