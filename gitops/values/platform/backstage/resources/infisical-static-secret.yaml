apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: backstage-secrets
  namespace: backstage
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /backstage
  targets:
    - name: backstage-db-credentials
      namespace: backstage
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations: {}
      template:
        engineVersion: v1
        data:
          username: "{{ .BACKSTAGE_DATABASE_USERNAME.Value }}"
          password: "{{ .BACKSTAGE_DATABASE_PASSWORD.Value }}"
    - name: backstage-secrets
      namespace: backstage
      kind: Secret
      creationPolicy: Owner
      metadata:
        annotations: {}
      template:
        engineVersion: v1
        data:
          backend-secret: "{{ .BACKSTAGE_BACKEND_SECRET.Value }}"
    - name: backstage-auth-secrets
      namespace: backstage
      kind: Secret
      creationPolicy: Owner
      metadata:
        annotations: {}
      template:
        engineVersion: v1
        data:
          oidc-client-secret: "{{ .BACKSTAGE_KEYCLOAK_CLIENT_SECRET.Value }}"
          auth-session-secret: "{{ .BACKSTAGE_AUTH_SESSION_SECRET.Value }}"
