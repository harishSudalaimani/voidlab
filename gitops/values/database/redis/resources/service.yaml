apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
spec:
  type: ClusterIP
  # Preserve the address already allocated to this Service. Kubernetes treats
  # both fields as immutable after creation.
  clusterIP: 10.110.45.151
  clusterIPs:
    - 10.110.45.151
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
