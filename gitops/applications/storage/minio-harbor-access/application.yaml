apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-harbor-access
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: storage
  source:
    repoURL: https://github.com/harishSudalaimani/voidlab.git
    targetRevision: main
    path: gitops/values/storage/minio/harbor-access/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
