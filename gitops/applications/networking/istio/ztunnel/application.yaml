apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: service-mesh
  sources:
    - repoURL: https://blob.istio.io/istio-release/charts
      chart: ztunnel
      targetRevision: 1.32.0
      helm:
        releaseName: ztunnel
        valueFiles:
          - $values/gitops/values/networking/istio/ztunnel-values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
