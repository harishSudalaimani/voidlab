apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  title: VoidLab Platform
  description: Owners of the VoidLab Kubernetes platform
spec:
  type: team
  profile:
    displayName: VoidLab Platform
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: contact
  title: Harish Messi
spec:
  profile:
    displayName: Harish Messi
    email: contact@harish8.com
  memberOf:
    - platform
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: voidlab-platform
  title: VoidLab Platform
  description: Core cluster services managed through GitOps
spec:
  owner: group:default/platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
