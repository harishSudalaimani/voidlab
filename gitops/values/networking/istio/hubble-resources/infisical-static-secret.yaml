apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: hubble-oauth2-proxy
  namespace: kube-system
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /hubble
  targets:
    - name: hubble-oauth2-proxy
      namespace: kube-system
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          client-id: hubble
          client-secret: "{{ .HUBBLE_OIDC_CLIENT_SECRET.Value }}"
          cookie-secret: "{{ .HUBBLE_OAUTH2_PROXY_COOKIE_SECRET.Value }}"
