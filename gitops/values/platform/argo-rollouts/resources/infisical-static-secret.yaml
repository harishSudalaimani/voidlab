apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: argo-rollouts-oauth2-proxy
  namespace: argo-rollouts
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /argo-rollouts
  targets:
    - name: argo-rollouts-oauth2-proxy
      namespace: argo-rollouts
      kind: Secret
      creationPolicy: Owner
      metadata:
        labels:
          app.kubernetes.io/part-of: argo-rollouts
        annotations: {}
      template:
        engineVersion: v1
        data:
          client-id: argo-rollouts
          client-secret: "{{ .ARGO_ROLLOUTS_OIDC_CLIENT_SECRET.Value }}"
          cookie-secret: "{{ .ARGO_ROLLOUTS_OAUTH2_PROXY_COOKIE_SECRET.Value }}"
