apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Security-related platform applications managed by Argo CD
  sourceRepos:
    - https://github.com/harishSudalaimani/voidlab.git
    - https://github.com/keycloak/keycloak-k8s-resources
    - https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno/
    - https://kyverno.github.io/policy-reporter
  destinations:
    - server: https://kubernetes.default.svc
      namespace: security
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: keycloak
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: policy-reporter
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: security
    - group: ""
      kind: Namespace
      name: cert-manager
    - group: ""
      kind: Namespace
      name: keycloak
    - group: ""
      kind: Namespace
      name: kyverno
    - group: ""
      kind: Namespace
      name: policy-reporter
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
    - group: policies.kyverno.io
      kind: DeletingPolicy
    - group: policies.kyverno.io
      kind: ValidatingPolicy
    - group: wgpolicyk8s.io
      kind: ClusterPolicyReport
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
