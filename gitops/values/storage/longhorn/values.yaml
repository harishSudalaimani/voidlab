defaultSettings:
  # Only nodes with an explicit disk definition from the GitOps source get a
  # default disk. The cp and worker annotations define their disks before the
  # Longhorn managers start.
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn/
  defaultReplicaCount: 2
  # Keep free filesystem space for Kubernetes and host workloads, especially
  # because the worker's Longhorn disk is on its root filesystem.
  storageMinimalAvailablePercentage: 15
  # Let system-managed Longhorn storage pods run on both nodes, including cp.
  taintToleration: node-role.kubernetes.io/control-plane:NoSchedule
  deletingConfirmationFlag: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2

# The chart's pre-upgrade Helm hook runs as Argo CD's PreSync hook, before
# Longhorn's service account exists on a fresh GitOps install.
preUpgradeChecker:
  jobEnabled: false

# Pin Longhorn's control components to cp. The manager DaemonSet overrides the
# global selector and runs on both nodes that have configured storage disks.
global:
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

longhornManager:
  nodeSelector:
    storage.voidlab.io/longhorn: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

longhornGlobalManager:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

longhornDriver:
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

longhornUI:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
