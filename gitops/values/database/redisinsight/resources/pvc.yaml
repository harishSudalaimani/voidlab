apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight-data
  namespace: database
  labels:
    app.kubernetes.io/name: redisinsight
    app.kubernetes.io/instance: redisinsight
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
