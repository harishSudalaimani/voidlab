apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: redis-credentials
  namespace: database
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /redis
  targets:
    - name: redis-credentials
      namespace: database
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          REDIS_PASSWORD: "{{ .REDIS_PASSWORD.Value }}"
