# Schedule the Kiali operator on cp.
nodeSelector:
  kubernetes.io/hostname: cp
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

cr:
  create: true
  name: kiali
  namespace: istio-system
  spec:
    auth:
      # OAuth2 Proxy enforces the Keycloak login at the only published route.
      strategy: anonymous
    deployment:
      cluster_wide_access: true
      pod_labels:
        istio.io/dataplane-mode: ambient
      replicas: 2
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    external_services:
      istio:
        istio_api_enabled: true
      prometheus:
        enabled: true
        url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
