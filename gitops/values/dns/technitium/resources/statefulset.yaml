apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
  namespace: dns
spec:
  serviceName: technitium-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: technitium
          image: technitium/dns-server:15.6.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 5380
              protocol: TCP
          env:
            - name: DNS_SERVER_DOMAIN
              value: dns.kiroku.life
            - name: DNS_SERVER_RECURSION
              value: AllowOnlyForPrivateNetworks
            - name: DNS_SERVER_ADMIN_PASSWORD_FILE
              value: /run/secrets/technitium/password
            - name: DNS_SERVER_FORWARDERS
              value: 1.1.1.1,9.9.9.9
            - name: DNS_SERVER_FORWARDER_PROTOCOL
              value: Udp
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /etc/dns
            - name: admin-password
              mountPath: /run/secrets/technitium
              readOnly: true
      volumes:
        - name: admin-password
          secret:
            secretName: technitium-admin
            items:
              - key: password
                path: password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
