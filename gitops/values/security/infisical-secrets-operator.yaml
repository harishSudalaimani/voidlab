hostAPI: http://infisical.infisical.svc.cluster.local:8080/api

controllerManager:
  serviceAccount:
    create: true
    name: infisical-secrets-operator
  scopedNamespaces:
    - minio-tenant
  scopedRBAC: true

# Argo CD applies the CRDs directly and does not wait on Helm hook Jobs.
defaultResourcesHelmHooks: false

defaultInfisicalConnection:
  enabled: true
  address: http://infisical.infisical.svc.cluster.local:8080/api
