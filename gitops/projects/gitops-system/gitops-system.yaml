apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Gateway API access for the Argo CD web interface
  sourceRepos:
    - https://github.com/harishSudalaimani/voidlab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: cert-manager.io
      kind: Certificate
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: BackendTLSPolicy
