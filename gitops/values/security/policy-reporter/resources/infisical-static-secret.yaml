apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: policy-reporter-oidc
  namespace: policy-reporter
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /keycloak
  targets:
    - name: policy-reporter-oidc
      namespace: policy-reporter
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          clientId: "policy-reporter"
          clientSecret: "{{ .POLICY_REPORTER_OIDC_CLIENT_SECRET.Value }}"
          discoveryUrl: "https://sso.kiroku.life/realms/voidlab/.well-known/openid-configuration"
