apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-secret-replication
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: security
  source:
    repoURL: https://github.com/harishSudalaimani/voidlab.git
    targetRevision: main
    path: gitops/values/security/infisical-secret-replication/resources
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: platform-secrets
      namespace: security
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: postgresql-app
      namespace: security
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
