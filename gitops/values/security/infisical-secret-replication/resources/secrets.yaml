apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-app
  namespace: security
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: replicate-platform-secrets-to-security-v2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: database-platform-secret-only
      expression: object.metadata.namespace == "database" && object.metadata.name == "platform-secrets"
  generate:
    - expression: generator.Apply("security", [object])
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: replicate-postgresql-app-to-security-v2
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: database-postgresql-app-only
      expression: object.metadata.namespace == "database" && object.metadata.name == "postgresql-app"
  generate:
    - expression: generator.Apply("security", [object])
