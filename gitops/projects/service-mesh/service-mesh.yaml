apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: service-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Istio ambient mesh, Gateway API, Kiali, and Hubble authentication
  sourceRepos:
    - https://github.com/harishSudalaimani/voidlab.git
    - https://github.com/kubernetes-sigs/gateway-api
    - https://blob.istio.io/istio-release/charts
    - https://kiali.org/helm-charts
    - https://oauth2-proxy.github.io/manifests
  destinations:
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: istio-system
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
