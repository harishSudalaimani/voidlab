apiVersion: storage.k8s.io/v1
kind: StorageClass
# Legacy class retained for existing claims. Its parameters are immutable;
# the MinIO tenant now creates new claims with longhorn-minio-single.
metadata:
  name: longhorn-minio
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "2"
  fsType: ext4
