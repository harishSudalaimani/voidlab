infisical:
  rolloutOnEveryRender: false
  replicaCount: 2
  kubeSecretRef: infisical-secrets
  extraEnv:
    - name: SITE_URL
      value: https://infisical.kiroku.life
  service:
    type: ClusterIP
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: infisical
          app.kubernetes.io/instance: infisical
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

ingress:
  enabled: false
  nginx:
    enabled: false

# Use the chart's bundled, single-instance PostgreSQL and Redis for this phase.
postgresql:
  enabled: true
  primary:
    nodeSelector:
      kubernetes.io/hostname: cp
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

redis:
  enabled: true
  architecture: standalone
  master:
    nodeSelector:
      kubernetes.io/hostname: cp
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    persistence:
      enabled: true
      storageClass: longhorn
      size: 2Gi
