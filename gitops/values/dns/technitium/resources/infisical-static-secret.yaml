apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: technitium-admin
  namespace: dns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /dns
  targets:
    - name: technitium-admin
      namespace: dns
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          password: "{{ .TECHNITIUM_ADMIN_PASSWORD.Value }}"
