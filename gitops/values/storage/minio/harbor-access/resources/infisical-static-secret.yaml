apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: minio-harbor-service-account
  namespace: minio
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /harbor
  targets:
    - name: minio-harbor-service-account
      namespace: minio
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          MINIO_ACCESS_KEY: "{{ .HARBOR_MINIO_ACCESS_KEY.Value }}"
          MINIO_SECRET_KEY: "{{ .HARBOR_MINIO_SECRET_KEY.Value }}"
