apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Security platform services managed by Argo CD
  sourceRepos:
    - https://github.com/harishSudalaimani/voidlab.git
    - https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    - https://openfga.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: database
    - server: https://kubernetes.default.svc
      namespace: minio-tenant
    - server: https://kubernetes.default.svc
      namespace: openfga
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: database
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
