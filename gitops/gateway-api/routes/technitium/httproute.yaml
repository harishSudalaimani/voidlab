apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium
  namespace: dns
spec:
  parentRefs:
    - name: public
      namespace: istio-system
      sectionName: https
  hostnames:
    - dns.kiroku.life
    - technitium.kiroku.life
  rules:
    - backendRefs:
        - name: technitium
          port: 5380
