apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: gitops-system
  source:
    repoURL: https://github.com/harishSudalaimani/voidlab.git
    targetRevision: main
    path: gitops/values/platform/argocd-auth/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
