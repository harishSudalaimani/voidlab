apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-infisical-bootstrap-secret
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Generate Infisical bootstrap secret
    policies.kyverno.io/description: Generate Infisical's initial authentication and encryption keys in the security namespace without storing secret values in Git.
spec:
  background: true
  rules:
    - name: generate-infisical-secrets
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - security
      context:
        - name: authSecret
          variable:
            jmesPath: random('[A-Za-z0-9]{43}')
        - name: encryptionKey
          variable:
            jmesPath: random('[a-f0-9]{32}')
      generate:
        generateExisting: true
        apiVersion: v1
        kind: Secret
        name: infisical-secrets
        namespace: "{{request.object.metadata.name}}"
        synchronize: false
        data:
          type: Opaque
          stringData:
            AUTH_SECRET: "{{authSecret}}="
            ENCRYPTION_KEY: "{{encryptionKey}}"
            SITE_URL: http://localhost:8081
