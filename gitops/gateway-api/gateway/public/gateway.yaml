apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-system
  annotations:
    external-dns.kubernetes.io/target: "192.168.29.254"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "*.kiroku.life"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: http-apex
      hostname: kiroku.life
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.kiroku.life"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-kiroku-life-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      hostname: kiroku.life
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-kiroku-life-tls
      allowedRoutes:
        namespaces:
          from: All
