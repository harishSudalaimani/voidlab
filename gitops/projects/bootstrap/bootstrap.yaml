apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Root project for VoidLab GitOps configuration
  sourceRepos:
    - https://github.com/harishSudalaimani/voidlab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
