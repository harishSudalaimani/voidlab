apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-client-namespaces
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              platform.voidlab.io/shared-redis-client: "true"
      ports:
        - protocol: TCP
          port: 6379
