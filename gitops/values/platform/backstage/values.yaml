backstage:
  replicas: 1
  image:
    registry: harbor.kiroku.life
    repository: library/voidlab-backstage
    tag: 1.55.2-oidc2
    pullPolicy: IfNotPresent
    pullSecrets:
      - backstage-harbor-pull
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  initContainers:
    - name: wait-for-postgresql
      image: ghcr.io/cloudnative-pg/postgresql:18.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
      args:
        - |
          until pg_isready --host=backstage-db-rw.backstage.svc.cluster.local --port=5432 --username=backstage --dbname=backstage; do
            echo "Waiting for Backstage PostgreSQL to accept connections"
            sleep 2
          done
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  extraEnvVars:
    - name: BACKSTAGE_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: backstage-db-credentials
          key: username
    - name: BACKSTAGE_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: backstage-db-credentials
          key: password
    - name: BACKSTAGE_BACKEND_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: backend-secret
    - name: BACKSTAGE_KEYCLOAK_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-auth-secrets
          key: oidc-client-secret
    - name: BACKSTAGE_AUTH_SESSION_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-auth-secrets
          key: auth-session-secret
  appConfig:
    app:
      title: VoidLab Developer Portal
      baseUrl: https://backstage.kiroku.life
    backend:
      baseUrl: https://backstage.kiroku.life
      cors:
        origin: https://backstage.kiroku.life
        methods:
          - GET
          - HEAD
          - PATCH
          - POST
          - PUT
          - DELETE
        credentials: true
      auth:
        keys:
          - secret: ${BACKSTAGE_BACKEND_SECRET}
      database:
        client: pg
        pluginDivisionMode: schema
        connection:
          host: backstage-db-rw.backstage.svc.cluster.local
          port: 5432
          user: ${BACKSTAGE_DB_USERNAME}
          password: ${BACKSTAGE_DB_PASSWORD}
          database: backstage
    auth:
      environment: production
      session:
        secret: ${BACKSTAGE_AUTH_SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: https://keycloak.kiroku.life/realms/voidlab/.well-known/openid-configuration
            clientId: backstage
            clientSecret: ${BACKSTAGE_KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                - resolver: emailLocalPartMatchingUserEntityName
                  allowedDomains:
                    - harish8.com
    catalog:
      rules:
        - allow:
            - Component
            - Domain
            - Group
            - Location
            - Resource
            - System
            - User
      locations:
        - type: url
          target: https://raw.githubusercontent.com/harishSudalaimani/voidlab/main/gitops/values/platform/backstage/catalog-info.yaml

httpRoute:
  enabled: false

postgresql:
  enabled: false

serviceAccount:
  create: true
  name: backstage
  automountServiceAccountToken: false
