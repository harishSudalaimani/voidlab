apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-gateway-class-defaults
  namespace: istio-system
  labels:
    gateway.istio.io/defaults-for-class: istio
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: cp
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: public
                  gateway.networking.k8s.io/gateway-class-name: istio
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-waypoint-class-defaults
  namespace: istio-system
  labels:
    gateway.istio.io/defaults-for-class: istio-waypoint
data:
  deployment: |
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: cp
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
