# Rook operator chart values.
image:
  repository: docker.io/rook/ceph
  tag: v1.21.2
  pullPolicy: IfNotPresent

crds:
  enabled: true

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 128Mi

csi:
  installCsiOperator: true

# rook-ceph-cluster chart values.
operatorNamespace: rook-ceph
clusterName: rook-ceph

toolbox:
  enabled: true

cephImage:
  repository: quay.io/ceph/ceph
  tag: v20.2.4
  allowUnsupported: false

cephClusterSpec:
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
  dashboard:
    enabled: true
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: worker-1
        devices:
          - name: vdb
      - name: worker-2
        devices:
          - name: vdb
  cleanupPolicy:
    # Keep this empty during normal operation. Rook requires a deliberate,
    # destructive confirmation before it sanitizes OSD disks on teardown.
    confirmation: ""

cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: host
      replicated:
        size: 2
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate

# Only the RBD block pool is enabled initially. Add CephFS or object storage
# later with a topology and replica policy that matches the cluster.
cephFileSystems: []
cephObjectStores: []
