defaultSettings:
  # Only nodes with an explicit disk definition from the GitOps source get a
  # default disk. The worker node annotations define those disks before the
  # Longhorn managers start.
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn/
  defaultReplicaCount: 3
  deletingConfirmationFlag: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

# The chart's pre-upgrade Helm hook runs as Argo CD's PreSync hook, before
# Longhorn's service account exists on a fresh GitOps install.
preUpgradeChecker:
  jobEnabled: false
