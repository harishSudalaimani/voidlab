apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-infisical-bootstrap-secret
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  evaluation:
    generateExisting:
      enabled: true
    skipBackgroundRequests: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - configmaps
  matchConditions:
    - name: infisical-bootstrap-trigger-only
      expression: object.metadata.namespace == "security" && object.metadata.name == "infisical-bootstrap-trigger"
  variables:
    - name: authSecret
      expression: random("[A-Za-z0-9]{43}") + "="
    - name: encryptionKey
      expression: random("[a-f0-9]{32}")
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: infisical-secrets
            namespace: (( object.metadata.namespace ))
          type: Opaque
          stringData:
            AUTH_SECRET: (( variables.authSecret ))
            ENCRYPTION_KEY: (( variables.encryptionKey ))
            SITE_URL: http://localhost:8081
