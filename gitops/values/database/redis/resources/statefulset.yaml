apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: database
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.3-alpine3.23
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              umask 077
              printf 'user default on >%s ~* &* +@all\n' "$REDIS_PASSWORD" > /tmp/users.acl
              unset REDIS_PASSWORD
              exec redis-server \
                --bind 0.0.0.0 \
                --port 6379 \
                --protected-mode yes \
                --aclfile /tmp/users.acl \
                --dir /data \
                --appendonly yes \
                --appendfsync everysec \
                --save 900 1 \
                --save 300 10 \
                --save 60 10000 \
                --maxmemory 512mb \
                --maxmemory-policy noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 8Gi
