apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-observability-service-account
  namespace: minio
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: cp
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile-service-account
              image: cgr.dev/chainguard/minio-client:latest-dev
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  export MC_CONFIG_DIR=/tmp/mc
                  mc alias set --insecure observability https://minio.minio.svc.cluster.local:443 \
                    "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

                  until mc admin info observability >/dev/null 2>&1; do
                    sleep 10
                  done

                  if mc admin user svcacct info observability "$MINIO_ACCESS_KEY" >/dev/null 2>&1; then
                    mc admin user svcacct edit \
                      --secret-key "$MINIO_SECRET_KEY" \
                      --policy /policy/policy.json \
                      observability "$MINIO_ACCESS_KEY"
                  else
                    mc admin user svcacct add \
                      --access-key "$MINIO_ACCESS_KEY" \
                      --secret-key "$MINIO_SECRET_KEY" \
                      --policy /policy/policy.json \
                      --name observability \
                      observability "$MINIO_ROOT_USER"
                  fi
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: minio-env-configuration
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: minio-env-configuration
                      key: MINIO_ROOT_PASSWORD
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-observability-service-account
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-observability-service-account
                      key: MINIO_SECRET_KEY
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: policy
                  mountPath: /policy
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: policy
              configMap:
                name: minio-observability-policy
            - name: tmp
              emptyDir: {}
