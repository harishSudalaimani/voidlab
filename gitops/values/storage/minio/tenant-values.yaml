tenant:
  name: minio

  # MinIO no longer serves public community images from Quay. Use the current
  # Chainguard-maintained public MinIO image instead.
  image:
    repository: docker.io/chainguard/minio
    tag: latest
    pullPolicy: Always

  # This Secret is produced by the InfisicalStaticSecret resource, not Git.
  configSecret:
    name: minio-env-configuration
    existingSecret: true

  pools:
    - name: pool-0
      # A single-node tenant suits this two-node lab. It is not distributed MinIO.
      servers: 1
      volumesPerServer: 1
      size: 1Ti
      storageClassName: longhorn-minio-single
      # The Chainguard image runs as UID/GID 65532; grant that identity access
      # to the Longhorn volume.
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/hostname: cp
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

  certificate:
    # MinIO speaks HTTP inside the ambient mesh; ztunnel provides transport mTLS.
    requestAutoCert: false

# Keep the S3 API internal. The Console UI is exposed through the shared
# Gateway API route and advertises minio.kiroku.life for browser redirects.
  exposeServices: {}
