defaultSettings:
  # Only nodes with an explicit disk definition from the GitOps source get a
  # default disk. The worker node annotations define those disks before the
  # Longhorn managers start.
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn/
  defaultReplicaCount: 3
  deletingConfirmationFlag: true

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

# The chart's pre-upgrade Helm hook runs as Argo CD's PreSync hook, before
# Longhorn's service account exists on a fresh GitOps install.
preUpgradeChecker:
  jobEnabled: false

# Pin Longhorn's user-deployed control-plane components to worker-1. The
# manager DaemonSet overrides the global selector and runs on every labeled
# worker; system-managed CSI and storage components retain Longhorn's default
# all-node placement.
global:
  nodeSelector:
    kubernetes.io/hostname: worker-1

longhornManager:
  nodeSelector:
    storage.voidlab.io/longhorn: "true"

longhornGlobalManager:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: worker-1

longhornDriver:
  nodeSelector:
    kubernetes.io/hostname: worker-1

longhornUI:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: worker-1
