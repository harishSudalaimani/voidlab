profile: ambient

# Keep two Istiod replicas available across both nodes.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

autoscaleEnabled: false
replicaCount: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - istiod
        topologyKey: kubernetes.io/hostname
