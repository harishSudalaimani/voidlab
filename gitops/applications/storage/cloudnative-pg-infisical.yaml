apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-infisical
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: storage
  source:
    repoURL: https://github.com/harishSudalaimani/voidlab.git
    targetRevision: main
    path: gitops/values/storage/cloudnative-pg
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
