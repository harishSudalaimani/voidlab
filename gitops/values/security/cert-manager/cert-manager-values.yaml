# This Application remains automated per the GitOps policy. Upstream lists
# cert-manager 1.21 as supporting Kubernetes only through 1.36; this cluster
# reports Kubernetes 1.37.2. Keep the chart pinned until a stable release
# confirms support for this Kubernetes version.
global:
  leaderElection:
    namespace: cert-manager

crds:
  enabled: true
  keep: true

nodeSelector:
  kubernetes.io/hostname: cp

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

webhook:
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

cainjector:
  nodeSelector:
    kubernetes.io/hostname: cp
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
