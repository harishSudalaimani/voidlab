apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: security
  sources:
    - repoURL: https://github.com/bitnami/sealed-secrets.git
      targetRevision: v0.41.2
      path: helm/sealed-secrets
      helm:
        releaseName: sealed-secrets-controller
        valueFiles:
          - $values/gitops/values/security/sealed-secrets/values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
