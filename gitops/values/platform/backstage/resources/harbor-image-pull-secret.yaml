apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: backstage-harbor-image-pull
  namespace: backstage
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /harbor
  targets:
    - name: backstage-harbor-pull
      namespace: backstage
      kind: Secret
      secretType: kubernetes.io/dockerconfigjson
      creationPolicy: Owner
      metadata:
        labels: {}
        annotations: {}
      template:
        engineVersion: v1
        data:
          .dockerconfigjson: >-
            {"auths":{"harbor.kiroku.life":{"username":"{{ .HARBOR_BACKSTAGE_PULL_USERNAME.Value }}","password":"{{ .HARBOR_BACKSTAGE_PULL_SECRET.Value }}"}}}
