apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://opencost.github.io/opencost-helm-chart
      chart: opencost
      targetRevision: 2.5.34
      helm:
        releaseName: opencost
        valueFiles:
          - $values/gitops/values/platform/opencost/values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      ref: values
    - repoURL: https://oauth2-proxy.github.io/manifests
      chart: oauth2-proxy
      targetRevision: 10.7.4
      helm:
        releaseName: opencost-auth-oauth2-proxy
        valueFiles:
          - $values/gitops/values/platform/opencost/oauth2-proxy-values.yaml
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      path: gitops/values/platform/opencost/resources
    - repoURL: https://github.com/harishSudalaimani/voidlab.git
      targetRevision: main
      path: gitops/gateway-api/routes/opencost
  destination:
    server: https://kubernetes.default.svc
    namespace: opencost
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
