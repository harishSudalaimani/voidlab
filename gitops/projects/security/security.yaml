apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Security-related platform applications managed by Argo CD
  sourceRepos:
    - https://github.com/harishSudalaimani/voidlab.git
    - https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: security
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: security
