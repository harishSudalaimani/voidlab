apiVersion: v1
kind: Service
metadata:
  name: technitium
  namespace: dns
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: web
      port: 5380
      targetPort: web
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-headless
  namespace: dns
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: web
      port: 5380
      targetPort: web
      protocol: TCP
