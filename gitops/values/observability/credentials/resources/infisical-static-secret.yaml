apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: observability-credentials
  namespace: observability
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /observability
  targets:
    - name: observability-credentials
      namespace: observability
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          MINIO_ACCESS_KEY: "{{ .MINIO_ACCESS_KEY.Value }}"
          MINIO_SECRET_KEY: "{{ .MINIO_SECRET_KEY.Value }}"
          admin-user: "{{ .GRAFANA_ADMIN_USER.Value }}"
          admin-password: "{{ .GRAFANA_ADMIN_PASSWORD.Value }}"
