apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: openfga-credentials
  namespace: openfga
spec:
  infisicalAuthRef:
    name: infisical-shared
    namespace: security
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: 60e9131c-3eef-403a-b2b1-94c393caf930
      environmentSlug: prod
      secretPath: /openfga
  targets:
    - name: openfga-credentials
      namespace: openfga
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          keys: "{{ .OPENFGA_PRESHARED_KEYS.Value }}"
